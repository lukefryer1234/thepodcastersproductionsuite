{% extends 'base.html' %}

{% block title %}Pricing{% endblock %}

{% block content %}
    <div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
        {% for plan in plans %}
            <div class="col">
                <div class="card mb-4 rounded-3 shadow-sm">
                    <div class="card-header py-3">
                        <h4 class="my-0 fw-normal">{{ plan.name }}</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">${{ plan.price }}<small class="text-muted fw-light">/mo</small></h1>
                        <ul class="list-unstyled mt-3 mb-4">
                            <li>{{ plan.processing_hours }} hours of audio processing included</li>
                        </ul>
                        <a href="{% url 'create_checkout_session' plan.stripe_price_id %}" class="w-100 btn btn-lg btn-primary">Subscribe</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
